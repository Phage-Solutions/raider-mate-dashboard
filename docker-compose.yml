# One service, because the deployed unit is one container: Caddy and the node process
# both come up inside it. See Dockerfile.
services:
  dashboard:
    build: .
    env_file: .env
    environment:
      # Local compose is plain HTTP, unlike the deployed container behind Scaleway's
      # edge. Astro's origin check refuses every POST if this claims otherwise.
      PUBLIC_SCHEME: http
    ports:
      - '8081:8080'
    restart: unless-stopped
